[project]
name = "tree-shaking"
version = "0.2.6b1"
description = 'Detect and eliminate "unused" files from dependencies to reduce packaging size of target application.'
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argsense>=1.1.2",
    "lk-utils>=3.6.1b0",
    # "poetry>=2.3.4",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# [dependency-groups]
# dev = []

# [project.optional-dependencies]
# ...

# [project.scripts]
# ...

[project.urls]
homepage = "https://github.com/likianta/python-tree-shaking"

[tool.hatch.build.targets.wheel]
packages = ["tree_shaking"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

# [tool.ruff.lint]
# extend-select = ["E501"]  # line too long
# extend-select = ["I001", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pycodestyle]
max-line-length = 83

# [tool.ty.environment]
# extra-paths = ["./lib"]

# [tool.ty.rules]
# invalid-type-form = "ignore"
# unresolved-attribute = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2191/"
# explicit = true

[tool.uv.sources]
argsense = { index = "likianta" }
lk-utils = { index = "likianta" }
